[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: Smoke tests for critical routes and page health
    navigation: Navigation, links, and history tests
    forms: Form inputs, validation, and submission tests
    interactions: Interactive UI components, buttons, and modals
    responsive: Responsive design and viewport scaling tests
    visual: Visual layout and asset integrity tests
    accessibility: Accessibility and WCAG compliance tests
    performance: Page load and navigation timing performance tests
    console: Browser console and runtime error monitoring
    cross_browser: Multi-browser execution tests
    auth: Authentication and login/logout flow tests
