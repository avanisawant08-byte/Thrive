<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .bg-cinematic {
            background: #0a0a0a;
        }
        .glass-border {
            border: 1px solid rgba(132, 149, 133, 0.2);
        }
        .gradient-button {
            background: linear-gradient(135deg, #f1ffef 0%, #00ff87 100%);
        }
        input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.15);
            border-color: rgba(0, 255, 135, 0.4) !important;
        }

        /* Reactive Glow */
        #reactive-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 255, 135, 0.15) 0%, rgba(0, 255, 135, 0) 70%);
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }

        /* Keystroke Pulse Overlay */
        #keystroke-pulse {
            position: absolute;
            inset: -40px;
            background: radial-gradient(circle, rgba(0, 255, 135, 0.2) 0%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            border-radius: 40px;
        }
        .pulse-anim {
            animation: pulse-ring 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.1); opacity: 0; }
        }

        /* Live Particle System */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
        }
        .particle {
            position: absolute;
            background: #00ff87;
            border-radius: 50%;
            opacity: 0;
            transition: transform 0.2s linear;
        }

        /* Enhanced Glass */
        .glass-container {
            background: rgba(53, 53, 52, 0.4);
            backdrop-filter: blur(40px) saturate(120%);
            -webkit-backdrop-filter: blur(40px) saturate(120%);
        }
    </style>

<script>
    // Reactive Glow Logic
    const glow = document.getElementById('reactive-glow');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        glow.style.left = mouseX + 'px';
        glow.style.top = mouseY + 'px';
    });

    // Particle System
    function initParticles() {
        const container = document.getElementById('particles');
        const count = 80;
        const particles = [];

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 3 + 1;
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const opacity = Math.random() * 0.4 + 0.1;
            
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${x}%`;
            p.style.top = `${y}%`;
            p.style.opacity = opacity;
            p.style.boxShadow = `0 0 ${size*2}px #00ff87`;
            
            container.appendChild(p);
            particles.push({
                el: p,
                x: x,
                y: y,
                speedX: (Math.random() - 0.5) * 0.05,
                speedY: (Math.random() - 0.5) * 0.05,
                baseX: x,
                baseY: y
            });
        }

        function animate() {
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                // Mouse interaction - particles react slightly
                const dx = (mouseX / window.innerWidth * 100) - p.x;
                const dy = (mouseY / window.innerHeight * 100) - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                let offsetX = 0;
                let offsetY = 0;
                if(dist < 15) {
                    offsetX = (dx / dist) * -1;
                    offsetY = (dy / dist) * -1;
                }

                if (p.x > 100) p.x = 0;
                if (p.x < 0) p.x = 100;
                if (p.y > 100) p.y = 0;
                if (p.y < 0) p.y = 100;

                p.el.style.transform = `translate(${offsetX * 20}px, ${offsetY * 20}px)`;
                p.el.style.left = `${p.x}%`;
                p.el.style.top = `${p.y}%`;
            });
            requestAnimationFrame(animate);
        }
        animate();
    }
    initParticles();

    // Keystroke Pulse Logic
    function triggerPulse() {
        const pulse = document.getElementById('keystroke-pulse');
        pulse.classList.remove('pulse-anim');
        void pulse.offsetWidth; // trigger reflow
        pulse.classList.add('pulse-anim');
    }
</script>
